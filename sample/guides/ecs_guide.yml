---
tasks:
- attachments:
  - type: |-
      Attachment type. Typically ElasticNetworkInterface
      (See [EC2 DeleteOnTermination](Reservations__0__Instances__0__BlockDeviceMappings__0__Ebs__DeleteOnTermination))
    status: |-
      Attachment status:
      ATTACHED = Successfully attached
      DETACHED = Detached
      
      Details: [AWS Docs](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-networking.html)
    details:
    - name: "Detail item name (e.g. subnetId, networkInterfaceId)"
      value: "Corresponding value"
  attributes:
  - name: "Attribute name"
    value: "Attribute value"
  clusterArn: "ARN of the cluster where the task is running"
  containers:
  - containerArn: "Container ARN"
    name: "Container name (defined in task definition)"
    image: "Docker image to use (e.g. nginx, myapp:latest)"
    runtimeId: |-
      Container runtime ID
      Unique identifier generated by Docker/containerd
    lastStatus: |-
      Latest status:
      PENDING = Starting up
      RUNNING = Currently running
      STOPPED = Stopped
    networkInterfaces:
    - attachmentId: "Corresponding attachment ID"
      privateIpv4Address: "Assigned private IP address"
    cpu: "CPU units allocated to the container"
    memory: "Memory allocated to the container (MiB)"
  cpu: "Total CPU units allocated to the task (fixed for Fargate)"
  desiredStatus: "Desired status of the task"
  launchType: |-
    Launch type:
    FARGATE = Serverless container execution
    EC2 = Run on your own EC2 instances
  memory: "Total memory allocated to the task (MiB)"
  platformVersion: "Fargate platform version (e.g. 1.4.0, LATEST)"
  taskDefinitionArn: "ARN of the task definition being used"
  ephemeralStorage:
    sizeInGiB: "Ephemeral storage size in GiB. Default 20GiB, max 200GiB"
failures:
  _hidden: true